name: Docs

# Builds the Sphinx documentation and publishes it on GitHub Pages
# (https://robin-schaefer.github.io/PyGFMC/).  Requires
# Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          sudo apt-get install -y pandoc
          pip install -c .github/constraints.txt -e "./codes" sphinx sphinx_rtd_theme nbsphinx
      - name: Build
        working-directory: docs
        run: python -m sphinx -b html -W --keep-going . _build/html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
