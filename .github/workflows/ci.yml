name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ruff
      - name: Lint
        run: |
          ruff check codes
          ruff check --config codes/pyproject.toml tests docs paper/images

  docs:
    needs: paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the docs embed the manuscript, which is not tracked: take the paper job's build
      - uses: actions/download-artifact@v4
        with:
          name: paper
          path: paper
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get install -y pandoc
          pip install -c .github/constraints.txt -e "./codes" sphinx sphinx_rtd_theme nbsphinx
      - name: Build
        working-directory: docs
        run: python -m sphinx -b html -W --keep-going . _build/html

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: PyGFMC.tex
          working_directory: paper
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/PyGFMC.pdf
