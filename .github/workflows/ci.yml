name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c .github/constraints.txt -e "./codes[test,netket]" ruff
      - name: Lint
        run: |
          ruff check codes
          ruff check --config codes/pyproject.toml tests docs paper/images
      - name: Core suite
        working-directory: tests
        run: pytest core -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get install -y pandoc
          pip install -c .github/constraints.txt -e "./codes" sphinx sphinx_rtd_theme nbsphinx
      - name: Build
        working-directory: docs
        run: python -m sphinx -b html -W --keep-going . _build/html

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: PyGFMC.tex
          working_directory: paper
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/PyGFMC.pdf
